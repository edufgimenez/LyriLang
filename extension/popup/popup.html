<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LyriLang</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="24" height="24">
    <h1>LyriLang</h1>
  </header>

  <section id="permission" class="permission" hidden>
    <p data-i18n="permissionText"></p>
    <button id="grant" type="button" data-i18n="grantAccess"></button>
  </section>

  <label class="row">
    <span data-i18n="showTranslation"></span>
    <input id="enabled" type="checkbox" role="switch">
  </label>

  <label class="field">
    <span data-i18n="translateTo"></span>
    <select id="targetLang"></select>
  </label>

  <p class="hint" data-i18n="hint"></p>

  <label class="row colors-row">
    <span data-i18n="customColors"></span>
    <input id="customColors" type="checkbox" role="switch">
  </label>
  <button id="openOptions" type="button" class="link"><span data-i18n="customizeColors"></span> ↗</button>

  <button id="clearCache" type="button" class="secondary" data-i18n="clearCache"></button>
  <span id="cacheStatus" class="visually-hidden" role="status"></span>

  <footer>
    <div class="footer-row">
      <a id="about" target="_blank" rel="noopener"><span data-i18n="aboutProject"></span> ↗</a>
      <span id="version" class="version"></span>
    </div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </footer>

  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
