<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsPageTitle">LyriLang</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="../src/content.css">
</head>
<body>
  <main>
    <header>
      <img src="../icons/icon-48.png" alt="" width="36" height="36">
      <div>
        <h1>LyriLang</h1>
        <p class="subtitle" data-i18n="optionsTitle"></p>
      </div>
    </header>

    <p class="intro" data-i18n="optionsIntro"></p>

    <label class="row">
      <span data-i18n="customColors"></span>
      <input id="customColors" type="checkbox" role="switch">
    </label>

    <fieldset id="colorFields">
      <div class="mode-row">
        <span data-i18n="backgroundLabel"></span>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="backgroundMode" value="color"><span data-i18n="bgModeColor"></span></label>
          <label><input type="radio" name="backgroundMode" value="image"><span data-i18n="bgModeImage"></span></label>
        </div>
      </div>

      <label id="bgColorRow" class="color-row">
        <span data-i18n="colorBackground"></span>
        <code data-hex="background"></code>
        <input type="color" data-color="background">
      </label>

      <div id="imageRows" class="image-rows" hidden>
        <div class="image-picker">
          <img id="wallpaperThumb" class="thumb" alt="" hidden>
          <span id="noImage" class="muted" data-i18n="noImage"></span>
          <div class="image-actions">
            <button id="pickImage" type="button" class="secondary small" data-i18n="chooseImage"></button>
            <button id="removeImage" type="button" class="link" data-i18n="removeImage" hidden></button>
          </div>
          <input id="imageFile" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" tabindex="-1">
        </div>
        <p id="imageError" class="error" role="alert" hidden></p>
        <label class="range-row">
          <span data-i18n="dimImage"></span>
          <input id="wallpaperDim" type="range" min="0" max="80" step="5">
          <output id="dimValue" for="wallpaperDim"></output>
        </label>
        <p class="note" data-i18n="imageLocalNote"></p>
      </div>

      <label class="color-row">
        <span data-i18n="colorActive"></span>
        <code data-hex="active"></code>
        <input type="color" data-color="active">
      </label>
      <label class="color-row">
        <span data-i18n="colorInactive"></span>
        <code data-hex="inactive"></code>
        <input type="color" data-color="inactive">
      </label>

      <label class="check-row">
        <input id="textShadow" type="checkbox">
        <span data-i18n="textShadow"></span>
      </label>
    </fieldset>

    <p class="preview-label" data-i18n="previewLabel"></p>
    <div id="preview" class="preview" aria-hidden="true">
      <div class="line passed" data-i18n="previewPassed"></div>
      <div class="line active">
        <div data-i18n="previewActive"></div>
        <div class="lyrilang-tr" data-i18n="previewTranslation"></div>
      </div>
      <div class="line inactive" data-i18n="previewInactive"></div>
    </div>

    <button id="restore" type="button" class="secondary" data-i18n="restoreDefaults"></button>
  </main>

  <script src="../src/shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
